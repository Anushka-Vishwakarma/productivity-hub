<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Mode</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo">
    <h2>Student Productivity Hub</h2>
    <p>Organize. Focus. Achieve.</p>
  </div>

  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="focus.html" class="active">Focus Mode</a>
    <a href="notes.html">Notes</a>
    <a href="about.html">About</a>
  </nav>
</header>

<main>

  <!-- BACK -->
  <div class="back-container">
    <a href="index.html" class="back-btn">⬅ Back to Dashboard</a>
  </div>

  <!-- CARDS -->
  <section class="cards-container">

  
    
    <!-- TIMER -->
    <div class="card highlight">
      <h3><i class="fa-solid fa-clock"></i> Focus Timer</h3>

      <div class="timer" id="timer">25:00</div>

      <div class="btn-group">
        <button class="start-btn" id="timer-start-btn"><i class="fa-solid fa-play"></i>Start</button>
        <button class="pause-btn" id="timer-pause-btn"><i class="fa-solid fa-pause"></i>Pause</button>
        <button class="reset-btn" id="timer-reset-btn"><i class="fa-solid fa-rotate-left"></i>Reset</button>
      </div>

      <p>Work for 25 minutes, then take a break.</p>
    </div>

    <!-- NOTES -->
    
  </section>

</main>
<script src="script.js"></script>
</body>
</html>
