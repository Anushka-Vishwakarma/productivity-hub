<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Productivity Hub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo">
    <h2>Student Productivity Hub</h2>
    <p>Organize. Focus. Achieve.</p>
  </div>

  <nav class="nav-links">
    <a href="index.html" class="active">Home</a>
    <a href="focus.html">Focus Mode</a>
    <a href="notes.html">Notes</a>
    <a href="about.html">About</a>
  </nav>
</header>

<!-- MAIN -->
<main>

  <!-- WELCOME -->
  <section class="welcome">
    <h1>Welcome</h1>
    <p>Let’s make today productive</p>
  </section>

  <!-- CARDS -->
  <section class="cards-container">

    <!-- TODO -->
    <div class="card">
      <h3><i class="fa-solid fa-list-check"></i>To-Do List</h3>

      <div class="input-box">
        <input type="text" placeholder="Add a new task..." id="task-input">
        <button class="start-btn">Add</button>
      </div>

      <ul class="task-list">
       
      </ul>

      <a href="focus.html" class="link">View Tasks -></a>
    </div>

    <!-- TIMER -->
    <div class="card highlight">
      <h1>⏱ Focus Timer</h1>

      <div class="timer">25:00</div>

      <a href="focus.html"><button class="secondary-btn">Go to Focus Mode</button></a>
    </div>

    <!-- NOTES -->
    <div class="card">
      <h3><i class="fa-solid fa-book"></i> Notes</h3>
        <div class="notes-container">
            <textarea class="noteInput" class="save-btn" placeholder="Write your notes here..."></textarea>
            <button class="save-btn"><i class="fa-solid fa-save"></i> Save Note</button>
        </div>

      <a href="notes.html" class="link">View Notes →</a>
    </div>

  </section>

  <!-- FOOTER -->
  <div class="footer-btn">
    <a href="focus.html">Go to Focus Mode →</a>
  </div>

</main>
<script src="script.js"></script>
</body>
</html>
